name: Upstream semantic sync

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      # Why: the verify step below runs vitest from the workspace, which needs a
      # real install. Without it every scheduled run dies before publishing.
      - run: pnpm install --frozen-lockfile
      - name: Generate semantic report
        run: node config/scripts/upstream-semantic-sync.mjs --fetch
      - name: Verify sync tooling
        run: pnpm exec vitest run --config config/vitest.config.ts config/scripts/upstream-semantic-sync.test.mjs config/scripts/publish-upstream-semantic-issue.test.mjs
      - name: Publish canonical tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node config/scripts/publish-upstream-semantic-issue.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: upstream-semantic-sync
          path: artifacts/upstream-semantic-sync
          if-no-files-found: error
