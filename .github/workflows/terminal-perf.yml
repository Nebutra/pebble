name: Tauri Terminal Performance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to check out (defaults to the workflow ref)
        required: false
        type: string
      runs:
        description: Number of native runtime samples
        required: false
        type: string
  schedule:
    - cron: '30 8 * * *'

jobs:
  terminal-perf:
    name: Tauri terminal runtime performance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PEBBLE_TERMINAL_PERF_RUNS: ${{ inputs.runs || '3' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: runtime/go/go.mod
      - uses: dtolnay/rust-toolchain@stable
      # Why: tauri build.rs compiles native/zig-system; without zig on PATH the
      # shell build fails with "failed to build Zig system library" (os error 2).
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y at-spi2-core dbus-x11 gir1.2-atspi-2.0 libwebkit2gtk-4.1-dev libappindicator3-dev python3-gi librsvg2-dev patchelf xvfb
      - run: pnpm install --frozen-lockfile

      # Why: this job builds the shell with --features local-speech, and
      # sherpa-rs-sys links against onnxruntime. Only tauri-desktop-release.yml
      # staged those libraries, so build.rs failed in every other workflow that
      # runs the same build. The scripts fall back to the host triple when
      # TAURI_RELEASE_TARGET_TRIPLE is unset, which is what these jobs want.
      # Why: Cargo evaluates Tauri's resource paths in build.rs, and
      # tauri.macos.conf.json lists the computer-use helper app. Without it the
      # build fails at "resource path ../../../native/computer-use-macos/.build/
      # release/Pebble Computer Use.app doesn't exist". tauri-desktop-release.yml
      # already stages it; ad-hoc signing is fine because nothing here ships.
      - name: Prepare ad-hoc macOS computer-use helper
        if: runner.os == 'macOS'
        env:
          PEBBLE_COMPUTER_MACOS_SIGN_IDENTITY: '-'
        run: |
          node apps/desktop/scripts/prepare-macos-native-test-resources.mjs
          node config/scripts/build-computer-macos.mjs

      - name: Ensure speech link libraries
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            node apps/desktop/scripts/ensure-linux-speech-link-libs.mjs
          elif [ "$RUNNER_OS" = "macOS" ]; then
            node apps/desktop/scripts/ensure-macos-speech-link-libs.mjs
          fi
      - name: Run renderer contracts and native Tauri performance gate
        run: xvfb-run --auto-servernum dbus-run-session -- node config/scripts/run-tauri-terminal-evidence.mjs --mode perf --output artifacts/tauri-terminal-perf/report.json
      - name: Upload terminal performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-terminal-performance
          path: artifacts/tauri-terminal-perf*
          retention-days: 14
          if-no-files-found: error
