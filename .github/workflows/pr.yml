name: PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  verify:
    runs-on: ubuntu-latest
    # Why: measured 17-20 minutes; a stuck compile should report inside the hour.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Why: the shell-build decision below diffs the PR range. At the
          # default depth of 1 neither endpoint is in the object store, so the
          # diff fails and the decision falls open to building every time — the
          # optimisation would be dead code that still looked alive.
          fetch-depth: 0

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 zsh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # Why: pnpm's bundled node-gyp ships gyp_main.py without execute
      # permission, which breaks native module builds (e.g. node-pty's
      # postinstall) with "/bin/sh: gyp_main.py: Permission denied".
      # Pin the fallback to the lockfile's node-gyp version so CI stays
      # reproducible while forcing pnpm to bypass its broken bundled copy.
      # Gate on runner.os == 'Linux' to match release.yml — the
      # npm-global path layout this step assumes is POSIX-shaped, and the
      # failure has only been observed on Linux runners. Today this job
      # pins runs-on: ubuntu-latest so the guard is a no-op, but it
      # prevents a silent break if a Windows/macOS matrix is added later.
      - name: Use external node-gyp to avoid pnpm's bundled copy (Linux only)
        if: runner.os == 'Linux'
        run: |
          npm install -g node-gyp@11.5.0
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Prepare dependency install
        run: |
          if [ -e node_modules ]; then
            ls -ld node_modules
            rm -rf node_modules
          fi

      - name: Install dependencies
        # Why: pnpm 10.24's frozen headless fast path can fail on fresh Ubuntu
        # runners while creating the root node_modules. Use the normal resolver
        # path, then verify package metadata stayed unchanged.
        run: |
          pnpm install --no-frozen-lockfile --prefer-frozen-lockfile=false
          git diff --exit-code package.json pnpm-lock.yaml

      - name: Lint
        run: pnpm exec oxlint --format github

      - name: Check styled scrollbars
        run: pnpm check:styled-scrollbars

      - name: Check reliability gate manifest
        run: pnpm run check:reliability-gates

      # Why: project-owned shared declarations must live in .ts so the main
      # typecheck owns them instead of skipLibCheck treating them as libraries.
      - name: Guard against project-owned .d.ts in shared contracts
        run: |
          matches=$(find packages/product-core/shared -name '*.d.ts' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Project-owned .d.ts files are not allowed under packages/product-core/shared."
            echo "Move type declarations into a .ts file so skipLibCheck does not hide errors."
            echo "See docs/preload-typecheck-hole.md."
            echo "Found:"
            echo "$matches"
            exit 1
          fi

      - name: Check feature wall asset budget
        run: pnpm check:feature-wall-assets

      # Why: the manifest embeds package.json's version and nothing regenerated
      # it on a bump, so it stayed at the fork baseline through every release
      # until 1.4.131. This gate lived only inside the `pnpm lint` aggregate,
      # which no job runs, so the drift shipped unnoticed.
      - name: Verify bundled skill guides
        run: pnpm verify:bundled-skills

      - name: Verify Tauri desktop mainline contract
        run: pnpm verify:tauri-mainline

      # Why: a job with no ceiling cannot report being stuck, only disappear.
      # v1.4.149 spent six hours in notarization and the release was missing for
      # three days with nothing anywhere saying so.
      - name: Verify workflow timeouts
        run: node config/scripts/verify-workflow-timeouts.mjs

      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements

      - name: Typecheck
        run: pnpm typecheck

      # Why separate from the shell: tauri's beforeBuildCommand bundles the
      # renderer, so skipping the shell would also skip that — and a bundling
      # failure (a bad dynamic import, a missing asset) is invisible to typecheck
      # and to vitest. It costs 26s against the shell's 643s, so it runs every
      # time and the expensive half is what gets skipped.
      - name: Build the renderer bundle
        run: pnpm --filter @pebble/desktop run build

      # Why: compiling the shell is 643s of a 1062s job — 61% — and only native
      # sources, their manifests, or the build inputs they embed can change it.
      # Deciding here keeps every later step's condition identical, so the build
      # and its toolchain can never disagree about whether to run.
      #
      # The decision fails open. An unreadable base, a missing diff, or a path
      # nobody thought of all resolve to "build" — a gate that skips work it
      # should have done is the failure this repo already paid for once, when a
      # typecheck that did not cover apps/desktop let a broken release cut.
      - name: Decide whether the desktop shell needs building
        id: shell_build
        run: |
          set -u
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "reason=no PR range available" >> "$GITHUB_OUTPUT"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Three dots, not two: a two-dot diff compares the two tips, so every
          # commit the base branch gained after this branch was cut shows up
          # inverted in the list. Practically every PR is behind its base by at
          # least one commit, which is why this gate reported "build" on every
          # run since it shipped and the skip branch had never once fired.
          #
          # --no-renames so a file moved OUT of a watched directory still lists
          # its old path; with rename detection only the destination is printed,
          # and a destination outside every pattern would read as "skip".
          if ! changed=$(git diff --name-only --no-renames "$base...$head" 2>/dev/null) || [ -z "$changed" ]; then
            echo "reason=could not read the changed files" >> "$GITHUB_OUTPUT"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every path here is a proven input to `tauri build`, not a guess:
          # updater-signature-verifier is a [[bin]] Cargo compiles from outside
          # src-tauri; resources/ holds icons and entitlements embedded by
          # generate_context!; scripts/ runs from beforeBuildCommand; .npmrc and
          # pnpm-workspace.yaml change module resolution for it.
          #
          # The leading "? absorbs git's core.quotePath quoting, which puts a
          # quote before a non-ASCII path and would otherwise defeat the anchor.
          if printf '%s\n' "$changed" | grep -qE '^"?(apps/desktop/src-tauri/|apps/desktop/updater-signature-verifier/|apps/desktop/scripts/|native/|runtime/go/|resources/|config/patches/|\.github/workflows/|\.npmrc$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|package\.json$|apps/desktop/package\.json$)'; then
            echo "reason=native sources or build inputs changed" >> "$GITHUB_OUTPUT"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "reason=no native sources or build inputs changed" >> "$GITHUB_OUTPUT"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'shell build needed: %s\n' "$(grep '^needed=' "$GITHUB_OUTPUT" | tail -1)"

      # Why: tauri build.rs compiles native/zig-system; without zig on PATH the
      # shell build fails with "failed to build Zig system library" (os error 2).
      - name: Setup Zig
        if: steps.shell_build.outputs.needed == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Tauri desktop shell
        if: steps.shell_build.outputs.needed == 'true'
        run: pnpm build:tauri:no-bundle

      - name: Skipped building the desktop shell
        if: steps.shell_build.outputs.needed != 'true'
        run: echo "Skipped — ${{ steps.shell_build.outputs.reason }}"

      # Why: tests run under system Node.js, so native modules must target the
      # Node ABI regardless of which desktop shell is built later in the job.
      - name: Rebuild better-sqlite3 for Node
        run: pnpm rebuild better-sqlite3

      - name: Test
        run: pnpm test

      # Why: run the native entrypoint and its prepared sidecars from a temp copy
      # so repository-local binaries cannot hide an incomplete Tauri artifact.
      #
      # Gated on the same decision as the compile: this is the one step that
      # consumes target/release, so skipping the build without skipping this
      # would run it against a binary that was never produced.
      - name: Smoke packaged CLI
        if: steps.shell_build.outputs.needed == 'true'
        run: >-
          node config/scripts/smoke-packaged-cli.mjs
          --app-dir=apps/desktop/src-tauri/target/release
          --sidecar-dir=apps/desktop/src-tauri/binaries

  # Why: `verify` never set up Go, so nothing gated runtime/go on a pull request —
  # the only workflows running `go test` were release-time or already chronically
  # red. This runs separately from `verify` so the Go suite does not extend that
  # job's critical path.
  go-tests:
    name: Go tests ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            packages: ./...
            flags: -race
          - os: macos-15
            platform: macos
            packages: ./...
            flags: -race
          # Why: providercli and the CLI packages stub their subprocesses with
          # `#!/bin/sh` fixtures that cmd.exe cannot execute, so Windows runs the
          # packages that actually carry platform-dependent behaviour — worktree
          # hooks, path handling, and host capability probing. `-race` is omitted
          # because it needs a CGO toolchain the runner does not reliably have;
          # Linux and macOS already cover the detector.
          - os: windows-latest
            platform: windows
            packages: ./internal/runtimecore/... ./internal/runtimehttp/... ./internal/hostprobe/...
            flags: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: runtime/go/go.mod
          cache-dependency-path: runtime/go/go.sum

      # Why: bash on every platform so the package list quotes identically; the
      # tests still spawn their own subprocesses through Go, not through this shell.
      - name: Test
        shell: bash
        working-directory: runtime/go
        run: go test ${{ matrix.flags }} -timeout 20m ${{ matrix.packages }}
