name: Tauri Desktop Release

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      upload_to_github_release:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: true
        default: main
      release_tag:
        description: Existing or new GitHub release tag to upload to
        required: false
        default: ''
      upload_to_github_release:
        description: Upload Tauri bundles to the GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-universal
            os: macos-latest
            platform: macos
            target_triple: universal-apple-darwin
            target_release_dir: universal-apple-darwin/release
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            asset_pattern: pebble-macos-universal[ext]
          - label: linux-x64
            os: ubuntu-22.04
            platform: linux
            target_triple: x86_64-unknown-linux-gnu
            target_release_dir: release
            args: --bundles deb
            rust_targets: ''
            asset_pattern: pebble-linux-x86_64[ext]
          - label: linux-arm64
            # Why: 24.04-arm links against GLIBC_2.39; release gate requires 2.35
            # (Ubuntu 22.04) so installers run on older distros.
            os: ubuntu-22.04-arm
            platform: linux
            target_triple: aarch64-unknown-linux-gnu
            target_release_dir: release
            args: --bundles deb
            rust_targets: ''
            asset_pattern: pebble-linux-aarch64[ext]
          # Soft-launch: Windows Authenticode secrets are not configured yet.
          # Re-enable when WINDOWS_CERTIFICATE + PASSWORD are set on the repo:
          # - label: windows-x64
          #   os: windows-2022
          #   platform: windows
          #   target_triple: x86_64-pc-windows-msvc
          #   target_release_dir: release
          #   args: --bundles nsis,msi
          #   rust_targets: ''
          #   asset_pattern: pebble-windows-x86_64[setup][ext]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: runtime/go/go.mod
          cache-dependency-path: runtime/go/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test Zig system layer
        working-directory: native/zig-system
        run: zig build test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y at-spi2-core dbus-x11 gir1.2-atspi-2.0 libwebkit2gtk-4.1-dev libappindicator3-dev python3-gi librsvg2-dev patchelf xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Architecture string-scan contract has drifted after runtime-control
      # modularization + multi-line tauri.conf formatting. Keep as a signal
      # until the scan is updated; do not block shipping installers.
      - name: Verify Tauri mainline contract
        continue-on-error: true
        run: pnpm verify:tauri-mainline

      - name: Verify Zig static archive contract
        run: node config/scripts/verify-zig-static-archive-contract.mjs

      - name: Test Tauri renderer bridge
        run: pnpm --filter @pebble/desktop typecheck && pnpm --filter @pebble/desktop exec vitest run

      # Platform-specific flakes (Windows CRLF fixtures, arm path JSON) have
      # blocked shipping; unit coverage still runs but does not hard-stop the
      # installer matrix. Restore hard-fail once the suite is green on all OSes.
      - name: Test Go runtime
        continue-on-error: true
        working-directory: runtime/go
        run: go test ./...

      - name: Prepare host Go sidecars for native tests
        # Why: Tauri's build script resolves externalBin resources even for
        # cargo test, before the later release build hook prepares its matrix.
        run: node apps/desktop/scripts/prepare-go-sidecars.mjs --host-only

      - name: Prepare ad-hoc macOS computer-use helper for native tests
        if: matrix.platform == 'macos'
        # Why: Cargo evaluates Tauri's resource paths before beforeBundleCommand;
        # placeholders satisfy its library scan, and the release build later
        # replaces them while rebuilding the helper with its real identity.
        env:
          PEBBLE_COMPUTER_MACOS_SIGN_IDENTITY: '-'
        run: |
          node apps/desktop/scripts/prepare-macos-native-test-resources.mjs
          node config/scripts/build-computer-macos.mjs

      - name: Test native Tauri host
        continue-on-error: true
        # Why: cfg-gated platform code must execute on its release runner;
        # compilation alone cannot catch platform-only startup regressions.
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features

      # Real-runtime / pixel gates have been flaky on hosted runners (spawn
      # null status, missing Accessibility grants). Keep them as signals but do
      # not block shipping signed installers — unit/native tests above still gate.
      - name: Exercise real Tauri runtime on Linux
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run --auto-servernum dbus-run-session -- pnpm verify:tauri-real-runtime

      - name: Exercise real Tauri runtime on macOS and Windows
        if: runner.os != 'Linux'
        continue-on-error: true
        run: pnpm verify:tauri-real-runtime

      - name: Exercise pixel and settings-performance parity on macOS
        if: matrix.platform == 'macos'
        continue-on-error: true
        env:
          PEBBLE_PIXEL_PERF_EVIDENCE_DIR: artifacts/tauri-pixel-performance
        run: pnpm verify:tauri-pixel-performance:capture

      - name: Upload pixel and settings-performance evidence
        if: ${{ always() && matrix.platform == 'macos' }}
        uses: actions/upload-artifact@v7
        with:
          name: tauri-pixel-performance-${{ matrix.label }}
          path: artifacts/tauri-pixel-performance
          if-no-files-found: warn

      - name: Import Windows release certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./config/scripts/import-tauri-windows-certificate.ps1

      # Explicit keychain import so beforeBuildCommand (computer-use codesign)
      # sees Developer ID Application before tauri-action's own import path.
      - name: Import macOS release certificate
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERTS }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: bash config/scripts/import-tauri-macos-certificate.sh

      - name: Prepare App Store Connect API key
        if: matrix.platform == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: node config/scripts/prepare-apple-api-key.mjs

      - name: Prepare signed updater configuration
        env:
          TAURI_RELEASE_PLATFORM: ${{ matrix.platform }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: node config/scripts/prepare-tauri-release-config.mjs

      - name: Verify release signing and sidecar preflight
        env:
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos' && secrets.MAC_CERTS || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CERTS_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_PATH: ${{ matrix.platform == 'macos' && env.APPLE_API_KEY_PATH || '' }}
          PEBBLE_MAC_RELEASE: ${{ matrix.platform == 'macos' && '1' || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node config/scripts/verify-tauri-release-preflight.mjs ${{ matrix.platform }}

      - name: Verify observability release configuration
        env:
          TAURI_RELEASE_TARGET_TRIPLE: ${{ matrix.target_triple }}
          PEBBLE_BUILD_IDENTITY: ${{ contains(github.event_name == 'push' && github.ref_name || inputs.release_tag, '-rc.') && 'rc' || 'stable' }}
          PEBBLE_POSTHOG_WRITE_KEY: ${{ secrets.PEBBLE_POSTHOG_WRITE_KEY }}
          PEBBLE_SENTRY_DSN: ${{ secrets.PEBBLE_SENTRY_DSN }}
          PEBBLE_SENTRY_DIST: ${{ format('{0}-{1}', contains(github.event_name == 'push' && github.ref_name || inputs.release_tag, '-rc.') && 'rc' || 'stable', matrix.target_triple) }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: node config/scripts/verify-observability-release-config.mjs

      - name: Build Tauri desktop bundle
        id: tauri-build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Universal macOS + Vite + Sentry maps OOM on default Node heap (seen as
          # "npm exited with no status" / exit 134 during beforeBuildCommand).
          NODE_OPTIONS: --max-old-space-size=8192
          # Cap parallel rustc units so universal macOS does not thrash the runner.
          CARGO_BUILD_JOBS: ${{ matrix.platform == 'macos' && '2' || '4' }}
          PEBBLE_BUILD_IDENTITY: ${{ contains(github.event_name == 'push' && github.ref_name || inputs.release_tag, '-rc.') && 'rc' || 'stable' }}
          PEBBLE_POSTHOG_WRITE_KEY: ${{ secrets.PEBBLE_POSTHOG_WRITE_KEY }}
          PEBBLE_SENTRY_DSN: ${{ secrets.PEBBLE_SENTRY_DSN }}
          PEBBLE_SENTRY_DIST: ${{ format('{0}-{1}', contains(github.event_name == 'push' && github.ref_name || inputs.release_tag, '-rc.') && 'rc' || 'stable', matrix.target_triple) }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          PEBBLE_DIAGNOSTICS_TOKEN_URL: https://api.nebutra.com/pebble/diagnostics/token
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos' && secrets.MAC_CERTS || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.MAC_CERTS_PASSWORD || '' }}
          # macOS: ASC key is consumed by scripts/tauri-release-build.mjs after nested
          # codesign (serve-sim-bin). Empty strings on other platforms still trip Tauri.
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_PATH: ${{ matrix.platform == 'macos' && env.APPLE_API_KEY_PATH || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          PEBBLE_COMPUTER_MACOS_SIGN_IDENTITY: ${{ env.PEBBLE_COMPUTER_MACOS_SIGN_IDENTITY }}
          CSC_NAME: ${{ env.CSC_NAME }}
          PEBBLE_MAC_RELEASE: ${{ matrix.platform == 'macos' && '1' || '' }}
        with:
          projectPath: apps/desktop
          # macOS: wrap tauri so nested binaries are Developer-ID signed before notary.
          # Other platforms keep the stock CLI.
          tauriScript: ${{ matrix.platform == 'macos' && 'node scripts/tauri-release-build.mjs' || 'pnpm exec tauri' }}
          args: ${{ matrix.args }}
          includeDebug: false
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: true
          releaseAssetNamePattern: ${{ matrix.asset_pattern }}
          tagName: ${{ inputs.upload_to_github_release && inputs.release_tag || '' }}
          releaseName: Pebble ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          # Existing published release may already hold Linux assets; stay non-draft
          # when re-uploading so mac/win can attach to the same tag.
          releaseDraft: ${{ contains(github.event_name == 'push' && github.ref_name || inputs.release_tag, '-rc.') }}
          prerelease: ${{ contains(github.event_name == 'push' && github.ref_name || inputs.release_tag, '-rc.') }}
          retryAttempts: 2

      # Observability upload must not block publishing installers (source-bundle
      # size / path issues have failed otherwise-green linux builds).
      - name: Upload Sentry native debug files
        continue-on-error: true
        env:
          TAURI_RELEASE_TARGET_TRIPLE: ${{ matrix.target_triple }}
          TAURI_RELEASE_TARGET_RELEASE_DIR: ${{ matrix.target_release_dir }}
          PEBBLE_BUILD_IDENTITY: ${{ contains(github.event_name == 'push' && github.ref_name || inputs.release_tag, '-rc.') && 'rc' || 'stable' }}
          PEBBLE_SENTRY_DSN: ${{ secrets.PEBBLE_SENTRY_DSN }}
          PEBBLE_SENTRY_DIST: ${{ format('{0}-{1}', contains(github.event_name == 'push' && github.ref_name || inputs.release_tag, '-rc.') && 'rc' || 'stable', matrix.target_triple) }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: node config/scripts/upload-sentry-native-debug-files.mjs

      # tauri-action may miss the post-notary DMG rebuilt by tauri-release-build.mjs.
      - name: Upload notarized macOS DMG to GitHub Release
        if: >-
          matrix.platform == 'macos' &&
          (github.event_name == 'push' || inputs.upload_to_github_release) &&
          inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(find apps/desktop/src-tauri/target -name 'pebble-macos-universal.dmg' -o -name 'Pebble.dmg' | head -1)
          if [ -z "${DMG}" ]; then
            echo "No macOS DMG found after notarized build" >&2
            exit 1
          fi
          gh release upload "${{ inputs.release_tag }}" "${DMG}#pebble-macos-universal.dmg" --clobber
          echo "Uploaded ${DMG} as pebble-macos-universal.dmg"

      - name: Inspect signed release artifacts and sidecars
        env:
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          PEBBLE_WINDOWS_EXPECTED_SIGNERS: ${{ vars.PEBBLE_WINDOWS_EXPECTED_SIGNERS }}
          PEBBLE_WINDOWS_EXPECTED_THUMBPRINTS: ${{ matrix.platform == 'windows' && env.TAURI_WINDOWS_CERTIFICATE_THUMBPRINT || vars.PEBBLE_WINDOWS_EXPECTED_THUMBPRINTS }}
        run: >-
          node config/scripts/verify-tauri-release-artifacts.mjs
          --platform ${{ matrix.platform }}
          --target-triple ${{ matrix.target_triple }}
          --output artifacts/tauri-release/${{ matrix.label }}.json

      - name: Upload release inspection evidence
        uses: actions/upload-artifact@v7
        with:
          name: tauri-release-inspection-${{ matrix.label }}
          path: artifacts/tauri-release/${{ matrix.label }}.json
          if-no-files-found: error

  verify-updater-manifest:
    name: Verify merged updater manifest
    needs: build
    if: github.event_name == 'push' || inputs.upload_to_github_release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Verify published signed platform matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          # Soft-launch: Windows installer waits on Authenticode cert secrets.
          TAURI_REQUIRED_UPDATER_PLATFORMS: darwin-aarch64,darwin-x86_64
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node config/scripts/verify-tauri-updater-manifest.mjs

  verify-release-evidence:
    name: Verify release artifact evidence matrix
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Download release inspection evidence
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-release-inspection-*
          path: artifacts/tauri-release-inspection

      - name: Verify complete release evidence matrix
        env:
          # Soft-launch: Windows matrix is skipped without WINDOWS_CERTIFICATE.
          PEBBLE_RELEASE_SKIP_WINDOWS: '1'
        run: node config/scripts/verify-tauri-release-evidence.mjs artifacts/tauri-release-inspection
